<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#000;}
</style></head><body>
<div style="display:flex;width:1920px;height:1080px;">
<div id="strip" style="width:0;background:#c8a45e;"></div>
<div style="width:920px;background:#1a1a1a;padding:80px 70px;display:flex;flex-direction:column;justify-content:center;">
  <div id="e0" style="opacity:0;font-size:14px;color:#c8a45e;letter-spacing:4px;">PROPERTY TOUR</div>
  <div id="e1" style="opacity:0;margin-top:14px;font-size:44px;font-weight:700;color:#fff;line-height:1.15;">{{property_name}}</div>
  <div id="e2" style="opacity:0;margin-top:24px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:14px;"><img src="{{bed_icon}}" style="width:26px;height:26px;filter:invert(1) brightness(0.7);"><span style="font-size:17px;color:rgba(255,255,255,0.7);">{{bedrooms}} Bedrooms</span></div>
    <div style="display:flex;align-items:center;gap:14px;"><img src="{{bath_icon}}" style="width:26px;height:26px;filter:invert(1) brightness(0.7);"><span style="font-size:17px;color:rgba(255,255,255,0.7);">{{bathrooms}} Bathrooms</span></div>
    <div style="display:flex;align-items:center;gap:14px;"><img src="{{sqft_icon}}" style="width:26px;height:26px;filter:invert(1) brightness(0.7);"><span style="font-size:17px;color:rgba(255,255,255,0.7);">{{area_sqft}} Sq Ft</span></div>
  </div>
  <div id="e3" style="opacity:0;margin-top:28px;font-size:42px;font-weight:700;color:#c8a45e;">{{listing_price}}</div>
</div>
<div id="e4" style="flex:1;overflow:hidden;opacity:0;"><img src="{{photo_1}}" style="width:100%;height:100%;object-fit:cover;"></div>
</div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"strip",delay:100,dur:600,type:"expandStripW",target:2},{id:"e4",delay:300,dur:700,type:"fade"},{id:"e0",delay:600,dur:600,type:"slideLeft"},{id:"e1",delay:900,dur:700,type:"slideLeft"},{id:"e2",delay:1500,dur:700,type:"slideLeft"},{id:"e3",delay:2200,dur:700,type:"slideLeft"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
