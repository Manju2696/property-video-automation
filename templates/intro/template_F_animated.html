<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#000;}
.chip{background:rgba(255,255,255,0.08);border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:8px;}
.chip img{width:22px;height:22px;filter:invert(1);}
</style></head><body>
<div style="display:flex;width:1920px;height:1080px;">
<div style="width:960px;background:#1a1a1a;padding:80px;display:flex;flex-direction:column;justify-content:center;">
  <div id="e0" style="opacity:0;font-size:52px;font-weight:800;color:#fff;line-height:1.05;letter-spacing:-1px;">{{property_name}}</div>
  <div id="e1" style="opacity:0;margin-top:24px;display:flex;gap:12px;">
    <div class="chip"><img src="{{bed_icon}}"><span style="font-size:16px;color:#fff;"><b>{{bedrooms}}</b> BD</span></div>
    <div class="chip"><img src="{{bath_icon}}"><span style="font-size:16px;color:#fff;"><b>{{bathrooms}}</b> BA</span></div>
    <div class="chip"><img src="{{sqft_icon}}"><span style="font-size:16px;color:#fff;"><b>{{area_sqft}}</b> SF</span></div>
  </div>
  <div id="e2" style="opacity:0;margin-top:28px;font-size:48px;font-weight:800;color:#fff;">{{listing_price}}</div>
</div>
<div id="e3" style="width:960px;overflow:hidden;opacity:0;"><img src="{{photo_1}}" style="width:100%;height:100%;object-fit:cover;"></div>
</div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"e3",delay:0,dur:800,type:"slideRight"},{id:"e0",delay:500,dur:700,type:"slideUp"},{id:"e1",delay:1300,dur:700,type:"slideUp"},{id:"e2",delay:2100,dur:700,type:"slideUp"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
