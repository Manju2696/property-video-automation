<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#000;}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;}
.grad{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.5) 40%,transparent 75%);}
.lft{position:absolute;left:100px;top:50%;transform:translateY(-50%);max-width:750px;}
.gl{width:0;height:3px;background:#c8a45e;margin:24px 0;}
</style></head><body>
<img src="{{photo_1}}" class="bg" id="bg">
<div class="grad"></div>
<div class="lft">
  <div id="e0" style="opacity:0;font-size:16px;color:#c8a45e;letter-spacing:5px;">EXCLUSIVE LISTING</div>
  <div id="e1" style="opacity:0;margin-top:14px;font-size:48px;font-weight:700;color:#fff;line-height:1.15;">{{property_name}}</div>
  <div class="gl" id="e2"></div>
  <div id="e3" style="opacity:0;display:flex;gap:28px;">
    <div style="display:flex;align-items:center;gap:10px;"><img src="{{bed_icon}}" style="width:28px;height:28px;filter:invert(1) brightness(0.8);"><span style="font-size:18px;color:rgba(255,255,255,0.8);"><b style="font-size:26px;color:#fff;">{{bedrooms}}</b> Beds</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><img src="{{bath_icon}}" style="width:28px;height:28px;filter:invert(1) brightness(0.8);"><span style="font-size:18px;color:rgba(255,255,255,0.8);"><b style="font-size:26px;color:#fff;">{{bathrooms}}</b> Baths</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><img src="{{sqft_icon}}" style="width:28px;height:28px;filter:invert(1) brightness(0.8);"><span style="font-size:18px;color:rgba(255,255,255,0.8);"><b style="font-size:26px;color:#fff;">{{area_sqft}}</b> Sq Ft</span></div>
  </div>
  <div id="e4" style="opacity:0;margin-top:28px;font-size:42px;font-weight:700;color:#fff;">{{listing_price}}</div>
</div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"bg",delay:0,dur:800,type:"fade"},{id:"e0",delay:400,dur:600,type:"slideLeft"},{id:"e1",delay:700,dur:700,type:"slideLeft"},{id:"e2",delay:1200,dur:600,type:"expandWidth",target:70},{id:"e3",delay:1600,dur:700,type:"slideLeft"},{id:"e4",delay:2300,dur:700,type:"slideLeft"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
