<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#f5f0eb;}
</style></head><body>
<div style="display:flex;width:1920px;height:1080px;">
<div style="width:1120px;position:relative;"><div id="e0" style="position:absolute;inset:50px 0 50px 50px;border-radius:10px;overflow:hidden;opacity:0;"><img src="{{photo_1}}" style="width:100%;height:100%;object-fit:cover;"></div></div>
<div style="width:800px;padding:80px 60px;display:flex;flex-direction:column;justify-content:center;">
  <div id="e1" style="opacity:0;font-family:'Playfair Display',serif;font-size:13px;color:#999;letter-spacing:4px;">PRESENTED BY REALTY GROUP</div>
  <div id="e2" style="opacity:0;margin-top:16px;font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:#1a1a1a;line-height:1.2;">{{property_name}}</div>
  <div id="e3" style="width:0;height:2px;background:#1a1a1a;margin:24px 0;"></div>
  <div id="e4" style="opacity:0;display:flex;gap:24px;">
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{bed_icon}}" style="width:24px;height:24px;filter:invert(30%);"><span style="font-size:16px;color:#666;"><b style="color:#1a1a1a;">{{bedrooms}}</b> Beds</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{bath_icon}}" style="width:24px;height:24px;filter:invert(30%);"><span style="font-size:16px;color:#666;"><b style="color:#1a1a1a;">{{bathrooms}}</b> Baths</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{sqft_icon}}" style="width:24px;height:24px;filter:invert(30%);"><span style="font-size:16px;color:#666;"><b style="color:#1a1a1a;">{{area_sqft}}</b> Sq Ft</span></div>
  </div>
  <div id="e5" style="opacity:0;margin-top:24px;font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:#1a1a1a;">{{listing_price}}</div>
</div></div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"e0",delay:0,dur:800,type:"slideLeft"},{id:"e1",delay:500,dur:600,type:"slideUp"},{id:"e2",delay:800,dur:700,type:"slideUp"},{id:"e3",delay:1300,dur:600,type:"expandWidth",target:50},{id:"e4",delay:1700,dur:700,type:"slideUp"},{id:"e5",delay:2300,dur:700,type:"slideUp"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
