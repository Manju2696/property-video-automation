<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#fff;}
.icl{width:74px;height:74px;border:2px solid #ccc;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.icl img{width:34px;height:34px;}
</style></head><body>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:1920px;height:1080px;text-align:center;">
  <div id="e0" style="opacity:0;display:flex;gap:8px;">
    <div style="width:120px;height:75px;border-radius:8px;overflow:hidden;"><img src="{{photo_1}}" style="width:100%;height:100%;object-fit:cover;"></div>
    <div style="width:120px;height:75px;border-radius:8px;overflow:hidden;"><img src="{{photo_2}}" style="width:100%;height:100%;object-fit:cover;"></div>
  </div>
  <div id="e1" style="opacity:0;margin-top:24px;font-size:44px;font-weight:700;color:#1a1a1a;">{{property_name}}</div>
  <div id="e2" style="width:0;height:1.5px;background:#ddd;margin:24px 0;"></div>
  <div id="e3" style="opacity:0;display:flex;gap:48px;">
    <div style="text-align:center;"><div class="icl"><img src="{{bed_icon}}" style="filter:invert(50%);"></div><div style="font-size:15px;color:#777;font-weight:500;">{{bedrooms}} BEDS</div></div>
    <div style="text-align:center;"><div class="icl"><img src="{{bath_icon}}" style="filter:invert(50%);"></div><div style="font-size:15px;color:#777;font-weight:500;">{{bathrooms}} BATHS</div></div>
    <div style="text-align:center;"><div class="icl"><img src="{{sqft_icon}}" style="filter:invert(50%);"></div><div style="font-size:15px;color:#777;font-weight:500;">{{area_sqft}} SQ FT</div></div>
  </div>
  <div id="e4" style="opacity:0;margin-top:24px;font-size:42px;font-weight:600;color:#1a1a1a;">{{listing_price}}</div>
</div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"e0",delay:200,dur:600,type:"scalePop"},{id:"e1",delay:600,dur:700,type:"slideUp"},{id:"e2",delay:1100,dur:600,type:"expandWidth",target:100},{id:"e3",delay:1500,dur:700,type:"slideUp"},{id:"e4",delay:2200,dur:700,type:"slideUp"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
