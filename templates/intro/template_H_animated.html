<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Poppins',sans-serif;background:#000;}
</style></head><body>
<div style="position:relative;width:1920px;height:1080px;">
<div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%;">
  <div id="g0" style="overflow:hidden;opacity:0;"><img src="{{photo_1}}" style="width:100%;height:100%;object-fit:cover;"></div>
  <div id="g1" style="overflow:hidden;opacity:0;"><img src="{{photo_2}}" style="width:100%;height:100%;object-fit:cover;"></div>
  <div id="g2" style="overflow:hidden;opacity:0;"><img src="{{photo_3}}" style="width:100%;height:100%;object-fit:cover;filter:brightness(0.9);"></div>
  <div id="g3" style="overflow:hidden;opacity:0;"><img src="{{photo_4}}" style="width:100%;height:100%;object-fit:cover;filter:brightness(0.9);"></div>
</div>
<div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
  <div id="e0" style="opacity:0;font-size:46px;font-weight:700;color:#fff;">{{property_name}}</div>
  <div id="e1" style="opacity:0;display:flex;gap:24px;margin-top:24px;align-items:center;">
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{bed_icon}}" style="width:24px;height:24px;filter:invert(1);"><span style="font-size:18px;color:rgba(255,255,255,0.9);">{{bedrooms}} Beds</span></div>
    <div style="color:rgba(255,255,255,0.3);font-size:20px;">|</div>
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{bath_icon}}" style="width:24px;height:24px;filter:invert(1);"><span style="font-size:18px;color:rgba(255,255,255,0.9);">{{bathrooms}} Baths</span></div>
    <div style="color:rgba(255,255,255,0.3);font-size:20px;">|</div>
    <div style="display:flex;align-items:center;gap:8px;"><img src="{{sqft_icon}}" style="width:24px;height:24px;filter:invert(1);"><span style="font-size:18px;color:rgba(255,255,255,0.9);">{{area_sqft}} Sq Ft</span></div>
  </div>
  <div id="e2" style="opacity:0;margin-top:24px;font-size:44px;font-weight:700;color:#c8a45e;">{{listing_price}}</div>
</div></div><script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

var config = [{id:"g0",delay:0,dur:500,type:"fade"},{id:"g1",delay:150,dur:500,type:"fade"},{id:"g2",delay:300,dur:500,type:"fade"},{id:"g3",delay:450,dur:500,type:"fade"},{id:"e0",delay:700,dur:700,type:"slideUp"},{id:"e1",delay:1400,dur:700,type:"slideUp"},{id:"e2",delay:2200,dur:700,type:"slideUp"}];

window.setAnimationTime = function(timeMs) {
  config.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    var progress = 0;
    if (timeMs < item.delay) progress = 0;
    else if (timeMs >= item.delay + item.dur) progress = 1;
    else progress = (timeMs - item.delay) / item.dur;
    var ep = easeOutCubic(progress);
    
    if (item.type === 'fade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideUp') {
      el.style.opacity = ep;
      el.style.transform = 'translateY(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'slideLeft') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(-40, 0, ep) + 'px)';
    } else if (item.type === 'scalePop') {
      el.style.opacity = ep;
      var s = lerp(0.75, 1, Math.min(1, ep * 1.15));
      el.style.transform = 'scale(' + s + ')';
    } else if (item.type === 'expandWidth') {
      el.style.width = lerp(0, item.target, ep) + 'px';
    } else if (item.type === 'slideInLeft') {
      el.style.left = lerp(-1920, 0, ep) + 'px';
    } else if (item.type === 'expandStrip') {
      el.style.transform = 'translateY(-50%) scaleX(' + ep + ')';
    } else if (item.type === 'fadeIn') {
      el.style.opacity = ep;
    } else if (item.type === 'fadeOut') {
      el.style.opacity = 1 - ep;
    } else if (item.type === 'expandH') {
      el.style.height = lerp(0, item.target, ep) + '%';
    } else if (item.type === 'gradientFade') {
      el.style.opacity = ep;
    } else if (item.type === 'slideRight') {
      el.style.opacity = ep;
      el.style.transform = 'translateX(' + lerp(30, 0, ep) + 'px)';
    } else if (item.type === 'expandStripW') {
      el.style.width = lerp(0, item.target, ep) + '%';
    }
  });
};
window.setAnimationTime(0);
window.templateReady = true;
</script></body></html>
